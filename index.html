<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>george morley</title>
    <link rel="stylesheet" href="footer.css">

    <style>
        html,
        body {
            background-color: #eeeeee;
            color: #111111;
            margin: 0;
            width: 100%;
            height: 100%;
        }
        
        body {
            min-height: 100vh;
            text-transform: lowercase;
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen-Sans, Ubuntu, Cantarell, Helvetica Neue, sans-serif;
        }

        a:link {
            color: #111111;
            text-underline-offset: 0.2em;
            text-decoration-thickness: 0.15em;
            text-decoration-style: solid;
            text-decoration-line: underline;
            text-decoration-color: color-mix(in srgb, currentcolor, transparent 70%);
        }

        a:visited {
            color: #111111;
        }

        a:hover {
            color: #111;
            cursor: pointer;
            text-decoration-thickness: 0.15em;
            text-decoration-color: #111111;
        }


        #main {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px 20px 100px;
            box-sizing: border-box;
        }

        .site-title {
            margin: 0 0 0.6em;
            line-height: 1.1;
            font-size: clamp(28px, 9vw, 48px);
            overflow-wrap: break-word;
        }

        .site-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.35em 0.6em;
            font-size: clamp(15px, 4vw, 12px);
            line-height: 1.5;
        }

        .site-nav .sep {
            user-select: none;
        }

        @media (max-width: 600px) {
            #main {
                padding-bottom: 130px;
            }
        }
    </style>
</head>

<body>

    <div id="main">
        <div>
            <h1 class="site-title">hey there</h1>

            <p>My name is George Morley. I go by <i>wcky</i> on the internet.</p>

            <p>I run <a href="http://www.glimpsefoundation.net" target="_blank" rel="noopener noreferrer">glimpse foundation</a> and spend a lot of time in the woods. I take <a href="https://www.wcky.fyi/photo.html" target="_blank" rel="noopener noreferrer">photos</a> and also post them on <a href="https://www.instagram.com/georgehmorley" target="_blank" rel="noopener noreferrer">instagram</a>.</p>
        </div>
    </div>

    <script src="footer.js" defer></script>

</body>

</html>
