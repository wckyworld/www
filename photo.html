<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>photos</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="footer-dark.css">

    <style>
        html,
        body {
            background-color: #111;
            color: #eee;
            margin: 0;
            width: 100%;
            height: 100%;
        }
        
        body {
            min-height: 100vh;
            text-transform: lowercase;
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Oxygen-Sans, Ubuntu, Cantarell, Helvetica Neue, sans-serif;
        }

        a:link {
            color: #eee;
            text-underline-offset: 0.2em;
            text-decoration-thickness: 0.15em;
            text-decoration-style: solid;
            text-decoration-line: underline;
            text-decoration-color: color-mix(in srgb, currentcolor, transparent 70%);
        }

        a:visited {
            color: #eee;
        }

        a:hover {
            color: #eee;
            cursor: pointer;
            text-decoration-thickness: 0.15em;
            text-decoration-color: #111111;
        }

        .page-header {
            padding: 28px 20px 4px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 14px;
            font-weight: normal;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .gallery {
            column-count: 3;
            column-gap: 14px;
            padding: 20px 20px 80px;
        }

        .gallery > a,
        .gallery > img {
            display: block;
            break-inside: avoid;
            margin-bottom: 14px;
        }

        .gallery a:hover {
            background-color: transparent;
        }

        .gallery img {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (max-width: 1000px) {
            .gallery {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            .gallery {
                column-count: 1;
                padding-left: 12px;
                padding-right: 12px;
                padding-bottom: 120px;
            }
        }
    </style>
</head>

<body>

    <main class="gallery" id="gallery"></main>

    <script>
        var PHOTOS = [
            "https://images.unsplash.com/photo-1690834515760-ed10d3760f64?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwcm9maWxlLXBhZ2V8MXx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1672654135130-2f49ff14fff1?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwcm9maWxlLXBhZ2V8Mnx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1690834515319-5714148dd71b?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwcm9maWxlLXBhZ2V8NHx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1672654064041-60ee1432f7b7?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwcm9maWxlLXBhZ2V8NXx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1670090090031-8537c2ac51a9?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwcm9maWxlLXBhZ2V8N3x8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1670098596823-2ff4f3fb4cfa?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwcm9maWxlLXBhZ2V8Nnx8fGVufDB8fHx8fA%3D%3D",
            "https://images.unsplash.com/photo-1698401422830-9ed810994256?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwcm9maWxlLXBhZ2V8M3x8fGVufDB8fHx8fA%3D%3D",
            "assets/images/fire.jpeg",
            "assets/images/tree.jpeg",
            "assets/images/911.jpg",
            "assets/images/duckie.JPG",
            "assets/images/forest.JPG",
            "assets/images/savotta.JPG",
            "assets/images/bmw.jpg",
            "assets/images/ipod.jpg",
            "assets/images/lightshow.jpeg",
            "assets/images/nice-flower.jpeg",
            "assets/images/car.jpeg",
            "assets/images/CINEICA_20261109_075205_493.jpeg",
            "assets/images/CINEICA_20261109_075459_582.jpeg",
            "assets/images/CINEICA_20261109_080032_104.jpeg",
            "assets/images/CINEICA_20261112_155040_165.jpeg",
            "assets/images/CINEICA_20261113_064108_610.jpeg",
            "assets/images/CINEICA_20261116_065837_195.jpeg",
            "assets/images/CINEICA_20261116_072606_083.jpeg",
            "assets/images/CINEICA_20261116_075919_974.jpeg"
        ];

        (function () {
            "use strict";

            var gallery = document.getElementById("gallery");

            PHOTOS.forEach(function (entry, index) {
                // A plain string is shorthand for { src: entry }.
                var photo = (typeof entry === "string") ? { src: entry } : entry;

                if (!photo || !photo.src) {
                    return;
                }

                var img = document.createElement("img");
                img.src = photo.src;
                img.alt = photo.alt || "Photo " + (index + 1) + " by wcky";
                img.loading = "lazy";

                // href defaults to the image itself; use href: null for a plain image.
                var href = ("href" in photo) ? photo.href : photo.src;

                if (!href) {
                    gallery.appendChild(img);
                    return;
                }

                var link = document.createElement("a");
                link.href = href;
                link.target = "_blank";
                link.rel = "noopener";
                link.appendChild(img);
                gallery.appendChild(link);
            });
        })();
    </script>

    <script src="footer.js" defer></script>

</body>

</html>
